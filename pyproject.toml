[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hud"
description = "HUD de terminal numa tela só: sistema, comandos permitidos, agenda, Vault, Claude Code e Codex."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
dynamic = ["version"]
classifiers = [
    "Environment :: Console :: Curses",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

# Sem [project.scripts]: o script que o pip gera para um ponto de entrada roda o
# Python do venv sem -I, e um PYTHONPATH apontando para módulos plantados seria
# carregado antes de qualquer código do HUD (já no sitecustomize). O comando
# `hud` instalado é scripts/hud, que roda `<venv>/bin/python -I -m hud`
# (hud/__main__.py → main()). Ver "Rodar" no README.

[tool.setuptools]
# hud._modelos e hud._skills são só dados: os modelos de custom/ e todas as
# skills de skills/ (cada uma numa subpasta com SKILL.md, às vezes com subpastas
# como modelos/), embutidos no pacote para quem instala pelo pipx (o binário leva
# a mesma cópia; ver packaging/hud.spec e hud/custom.py).
packages = ["hud", "hud._modelos", "hud._skills"]
script-files = ["scripts/hud"]

[tool.setuptools.package-dir]
"hud._modelos" = "custom"
"hud._skills" = "skills"

[tool.setuptools.package-data]
"hud._modelos" = ["README.md", "*/*.toml", "*/*.md", "*/*.txt"]
"hud._skills" = ["*/*.md", "*/*.txt", "*/*.toml", "*/*/*.md", "*/*/*.txt", "*/*/*.toml"]

[tool.setuptools.dynamic]
version = { attr = "hud.__version__" }
