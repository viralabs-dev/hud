name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.13']
        include:
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      # Só a saída (stdout/stderr) em UTF-8, para o log do Windows mostrar os
      # acentos. Não é PYTHONUTF8: esse mudaria o padrão de open() e esconderia
      # arquivo aberto sem encoding explícito.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: windows-curses (o Python do Windows não traz o módulo curses)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-test-windows.txt
      - run: python -m unittest discover -s tests -t .

  installer-sh:
    # install.sh no Linux (com o macOS simulado) e num macOS de verdade; no
    # Linux também a bateria do install.ps1 no pwsh (o que não depende do Windows).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash -n install.sh scripts/*.sh packaging/*.sh
      - run: bash scripts/test-installer.sh
      - name: install.ps1 no pwsh do Linux
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/test-installer.ps1

  installer-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: install.ps1 com PowerShell 7 (inclui o PATH do usuário no registro)
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Registry
      - name: install.ps1 com Windows PowerShell 5.1
        shell: pwsh
        run: ./scripts/test-installer.ps1 -Shell powershell.exe

  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner antigo de propósito: o binário herda o glibc mínimo do sistema
          # de build (Ubuntu 22.04 → glibc 2.35).
          - runner: ubuntu-22.04
            req: packaging/requirements-build.txt
            pkg: dist/hud_linux_amd64.tar.gz
          - runner: macos-14
            req: packaging/requirements-build-macos.txt
            pkg: dist/hud_darwin_arm64.tar.gz
          - runner: windows-latest
            req: packaging/requirements-build-windows.txt
            pkg: dist/hud_windows_amd64.zip
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      REQ: ${{ matrix.req }}
      PKG: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: PyInstaller num venv descartável (versões e hashes fixos)
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            venv="$(cygpath -u "$RUNNER_TEMP")/build-venv"; py="$venv/Scripts/python.exe"
          else
            venv="$RUNNER_TEMP/build-venv"; py="$venv/bin/python"
          fi
          python -m venv "$venv"
          "$py" -m pip install --require-hashes --only-binary=:all: -r "$REQ"
          echo "BUILD_PY=$py" >> "$GITHUB_ENV"
      - name: Monta o binário (scripts/release.sh, com smoke, isolamento e licenças)
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' hud/__init__.py | tr -d '\r')"
          PYTHON="$BUILD_PY" bash scripts/release.sh "v$version"
      - name: Smoke fora do repositório (Linux e macOS)
        if: runner.os != 'Windows'
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/build/pyinstaller/dist/hud" --version
          bash "$GITHUB_WORKSPACE/packaging/smoke.sh" "$GITHUB_WORKSPACE/build/pyinstaller/dist/hud"
      - name: Smoke fora do repositório (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          & "$env:GITHUB_WORKSPACE\build\pyinstaller\dist\hud.exe" --version
          & "$env:GITHUB_WORKSPACE\packaging\smoke.ps1" "$env:GITHUB_WORKSPACE\build\pyinstaller\dist\hud.exe"
      - name: Testes da tela contra o binário (pty, TERM=xterm-256color)
        if: runner.os != 'Windows'
        run: HUD_BIN="$PWD/build/pyinstaller/dist/hud" python -m unittest tests.test_ui -v
      - name: Instalador com o pacote real (Linux e macOS)
        if: runner.os != 'Windows'
        run: bash scripts/test-installer.sh "$PKG"
      - name: Instalador com o pacote real (Windows, PowerShell 7 e 5.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-installer.ps1 -Package $env:PKG
          ./scripts/test-installer.ps1 -Package $env:PKG -Shell powershell.exe
