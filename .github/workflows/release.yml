name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: windows-curses (o Python do Windows não traz o módulo curses)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-test-windows.txt
      - run: python -m unittest discover -s tests -t .
      - name: Instaladores (install.sh; install.ps1 no Windows)
        shell: bash
        run: |
          bash -n install.sh scripts/*.sh packaging/*.sh
          if [[ "$RUNNER_OS" == Windows ]]; then
            pwsh -NoProfile -File scripts/test-installer.ps1
            pwsh -NoProfile -File scripts/test-installer.ps1 -Shell powershell.exe
          else
            bash scripts/test-installer.sh
          fi

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          # Ubuntu 22.04 nos dois: glibc mínimo 2.35.
          - runner: ubuntu-22.04
            asset: hud_linux_amd64.tar.gz
            req: packaging/requirements-build.txt
          - runner: ubuntu-22.04-arm
            asset: hud_linux_arm64.tar.gz
            req: packaging/requirements-build.txt
          # macOS: cada arquitetura no próprio runner (o macos-13 Intel foi
          # aposentado; o macos-15-intel é o runner Intel que resta).
          - runner: macos-14
            asset: hud_darwin_arm64.tar.gz
            req: packaging/requirements-build-macos.txt
          - runner: macos-15-intel
            asset: hud_darwin_amd64.tar.gz
            req: packaging/requirements-build-macos.txt
          - runner: windows-latest
            asset: hud_windows_amd64.zip
            req: packaging/requirements-build-windows.txt
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      REQ: ${{ matrix.req }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: PyInstaller num venv descartável (versões e hashes fixos)
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            venv="$(cygpath -u "$RUNNER_TEMP")/build-venv"; py="$venv/Scripts/python.exe"
          else
            venv="$RUNNER_TEMP/build-venv"; py="$venv/bin/python"
          fi
          python -m venv "$venv"
          "$py" -m pip install --require-hashes --only-binary=:all: -r "$REQ"
          echo "BUILD_PY=$py" >> "$GITHUB_ENV"
      - name: Monta o binário (a tag precisa bater com hud/__init__.py)
        run: PYTHON="$BUILD_PY" bash scripts/release.sh "$GITHUB_REF_NAME"
      - name: O pacote é o esperado para este runner
        run: test -f "dist/$ASSET"
      - name: Testes da tela contra o binário
        if: runner.os != 'Windows'
        run: HUD_BIN="$PWD/build/pyinstaller/dist/hud" python -m unittest tests.test_ui -v
      - name: Instalador com o pacote real (Linux e macOS)
        if: runner.os != 'Windows'
        run: bash scripts/test-installer.sh "dist/$ASSET"
      - name: Instalador com o pacote real (Windows, PowerShell 7 e 5.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-installer.ps1 -Package "dist/$env:ASSET"
          ./scripts/test-installer.ps1 -Package "dist/$env:ASSET" -Shell powershell.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: hud_*
          merge-multiple: true
          path: dist
      - name: checksums.txt único (falha se faltar algum pacote)
        run: |
          cd dist
          sha256sum hud_linux_amd64.tar.gz hud_linux_arm64.tar.gz \
            hud_darwin_arm64.tar.gz hud_darwin_amd64.tar.gz \
            hud_windows_amd64.zip > checksums.txt
          cat checksums.txt
      - run: gh release create "$GITHUB_REF_NAME" dist/hud_* dist/checksums.txt --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
